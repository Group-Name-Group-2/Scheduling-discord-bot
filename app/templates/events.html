<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | Game Night</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.css"
        rel="stylesheet"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"
        defer
    ></script>

    <script
        src="{{ url_for('static', path='events.js') }}"
        defer
    ></script>
</head>

<body>
    {% include "navbar.html" %}

    <main class="container events-container">
        <div class="events-heading">
            <div>
                <h1>Game Night Calendar</h1>
                <p class="muted-text">
                    Keep track of upcoming game nights with your friends.
                </p>
            </div>
        </div>

        <section class="calendar-panel">
            <div id="calendar"></div>
        </section>

        <dialog id="event-details-modal" class="game-modal">
            <div class="game-modal-content">
                <button
                    type="button"
                    id="close-event-modal"
                    class="game-modal-close"
                    aria-label="Close event details"
                >
                    &times;
                </button>

                <img
                    id="event-modal-cover"
                    class="game-modal-cover"
                    src=""
                    alt=""
                    hidden
                >

                <div class="game-modal-info">
                    <h2 id="event-modal-title">Game Night</h2>

                    <div class="event-modal-details">
                        <div class="event-detail-row">
                            <span class="event-detail-label">Date</span>
                            <span id="event-modal-date"></span>
                        </div>

                        <div class="event-detail-row">
                            <span class="event-detail-label">Time</span>
                            <span id="event-modal-time"></span>
                        </div>

                        <div class="event-detail-row">
                            <span class="event-detail-label">Duration</span>
                            <span id="event-modal-duration"></span>
                        </div>

                        <div class="event-detail-section">
                            <h3>Hosted by</h3>
                            <p id="event-modal-creator"></p>
                        </div>

                        <div class="event-detail-section">
                            <h3>Participants</h3>
                            <ul
                                id="event-modal-participants"
                                class="event-participant-list"
                            ></ul>
                        </div>
                    </div>
                </div>
            </div>
        </dialog>
    </main>
</body>
</html>
