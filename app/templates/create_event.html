<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event | Game Night</title>

    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <script src="{{ url_for('static', path='create_event.js') }}" defer></script>
</head>
<body>
    {% include "navbar.html" %}

    <main class="container event-form-container">
        <div class="events-heading">
            <h1>Create a Game Night</h1>
            <p class="muted-text">
                Choose a game, schedule a time, and invite your friends.
            </p>
        </div>

        <form id="create-event-form" class="event-form">
            <div class="form-group">
                <label for="event-game">Game</label>

                <select id="event-game" name="game_id" required>
                    <option value="">Choose a game</option>

                    {% for game in games %}
                        <option
                            value="{{ game.appid }}"
                            {% if game.appid|string == game_id|string %}selected{% endif %}
                        >
                            {{ game.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="event-date">Date</label>
                    <input
                        type="date"
                        id="event-date"
                        name="event_date"
                        value="{{ date }}"
                        min="{{ today }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="event-time">Start time</label>
                    <input
                        type="time"
                        id="event-time"
                        name="time"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="event-duration">Duration</label>

                <select id="event-duration" name="duration">
                    <option value="60">1 hour</option>
                    <option value="90">1 hour 30 minutes</option>
                    <option value="120" selected>2 hours</option>
                    <option value="180">3 hours</option>
                    <option value="240">4 hours</option>
                </select>
            </div>

            <div class="form-group">
    <label>Participants</label>

    <div id="event-participants" class="event-participants">
        {% if friends %}
            {% for friend in friends %}
                <label class="event-participant">
                    <input
                        type="checkbox"
                        name="friend_ids"
                        value="{{ friend.steamid }}"
                        {% if friend.steamid in friend_ids %}checked{% endif %}
                    >

                    {% if friend.avatar %}
                        <img
                            src="{{ friend.avatar }}"
                            alt=""
                            class="event-participant-avatar"
                        >
                    {% endif %}

                    <span>{{ friend.name }}</span>
                </label>
            {% endfor %}
        {% else %}
            <p class="muted-text">
                No saved friends were found. Visit your Friends page
                to retrieve your Steam friends.
            </p>
        {% endif %}
    </div>
</div>

            <div class="event-form-actions">
                <a href="/events" class="button">Cancel</a>
                <button type="submit" class="button">
                    Create Event
                </button>
            </div>

            <p id="event-form-message" class="muted-text" role="status"></p>
        </form>
    </main>
</body>
</html>
