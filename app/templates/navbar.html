{% set nav_user = request.session.get("email") or request.session.get("steam_id") %}
<nav class="navbar">
    <a class="navbar-brand" href="/">Game Night</a>

    <div class="navbar-links">
        <a href="/">Home</a>
        <a href="/library">My Library</a>
        <a href="/friends">Friends</a>
        <a href="/shared-games">Shared Games</a>
        <a href="/events">Events</a>

        {% if nav_user %}
            <span class="navbar-user">{{ nav_user }}</span>
            <button id="navbar-logout-button" type="button">Sign out</button>
        {% else %}
            <a href="/login">Sign in</a>
        {% endif %}
    </div>
</nav>

{% if nav_user %}
<script>
    document.getElementById("navbar-logout-button").addEventListener("click", async () => {
        await fetch("/auth/logout", { method: "POST" });
        window.location.href = "/";
    });
</script>
{% endif %}
