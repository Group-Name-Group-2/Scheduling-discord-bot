<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email confirmed | Game Night</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    {% include "navbar.html" %}

    <main class="container settings-container">
        <div class="settings-card settings-confirmed">
            <h1>Email confirmed</h1>
            <p class="muted-text">
                {{ email }} is now linked to your Game Night account.
                You'll get an email when a friend sends you a message.
            </p>
            <a class="button" href="/auth/steam">Sign in with Steam</a>
        </div>
    </main>

    {% include "footer.html" %}
</body>
</html>
