<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ other_name }} | Messages | Game Night</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    {% include "navbar.html" %}

    <main class="container chat-container">
        <div class="chat-header">
            <a href="/messages" class="chat-back" aria-label="Back to messages">&larr;</a>

            {% if other_avatar %}
                <img src="{{ other_avatar }}" alt="" width="48" height="48">
            {% endif %}

            <h1>{{ other_name }}</h1>
        </div>

        <div
            id="chat-messages"
            class="chat-messages"
            aria-live="polite"
            data-me="{{ steam_id }}"
            data-other="{{ other_steam_id }}"
            data-last-id="{{ last_message_id }}"
        >
            {% for message in messages %}
                <div
                    class="chat-message {% if message.sender_steam_id == steam_id %}from-me{% else %}from-them{% endif %}"
                    data-message-id="{{ message.message_id }}"
                >
                    <p class="chat-body">{{ message.body }}</p>
                    <time class="chat-time" datetime="{{ message.created_at }}"></time>
                </div>
            {% else %}
                <p class="muted-text chat-empty" id="chat-empty">
                    No messages yet. Say hi!
                </p>
            {% endfor %}
        </div>

        <form id="chat-form" class="chat-form">
            <label for="chat-input" class="visually-hidden">Message</label>
            <textarea
                id="chat-input"
                name="body"
                rows="2"
                maxlength="{{ max_length }}"
                placeholder="Message {{ other_name }}..."
                required
            ></textarea>
            <button type="submit" id="chat-send">Send</button>
        </form>

        <p id="chat-error" class="chat-error" role="alert"></p>
    </main>

    {% include "footer.html" %}

    <script src="{{ url_for('static', path='messages.js') }}"></script>
</body>
</html>
